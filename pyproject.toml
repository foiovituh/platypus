[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "platypus"
version = "2.0.0"
description = "security enumeration tool"
authors = [
    { name = "foiovituh" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "dnspython",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
platypus = "platypus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]